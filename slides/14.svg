</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#0f766e" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#0f766e" opacity="0.05" filter="url(#bloom)"/><text x="68" y="110" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">7. Neurosymbolic Assurance</text><rect x="68" y="126" width="112" height="4" rx="2" fill="#0f766e"/><g filter="url(#lift)"><rect x="68" y="152" width="914" height="86" rx="16" fill="#e3f1ef" opacity="0.55"/><rect x="68" y="152" width="914" height="86" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="152" width="914" height="86" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="153" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="70" y="164" width="5" height="62" rx="2.5" fill="#0f766e"/><text x="102" y="192" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Does this answer follow from the policy we operate under — and</text><text x="102" y="226" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">if not, what assumption was silently supplied?</text><text x="68" y="292" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#0f766e" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">Solution 6 bounds what an agent may do;</text><text x="68" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">nothing bounds what it may say. Where the</text><text x="68" y="394" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">output is the product, the failure is</text><text x="68" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">entailment: no boundary crossed,</text><text x="68" y="458" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">liability all the same.</text><line x1="68" y1="476" x2="568" y2="476" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="508" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">LLM autoformalization drafts the theory;</text><text x="68" y="538" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">the domain expert ratifies it.</text><text x="68" y="578" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">PRECEDENT</text><text x="208" y="578" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Bedrock Automated Reasoning checks</text><text x="68" y="612" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">BUYERS</text><text x="208" y="612" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Banks and insurers · government</text><g filter="url(#lift)"><rect x="602" y="262" width="380" height="314" rx="18" fill="url(#glass)"/><rect x="602" y="262" width="380" height="314" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="616" y="263" width="352" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="628" y="304" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#0f766e" letter-spacing="3.2">WHAT WE BUILD</text><circle cx="633" cy="340" r="3.6" fill="#0f766e"/><text x="654" y="348" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Policy theory development,</text><text x="654" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">scope stated</text><circle cx="633" cy="418" r="3.6" fill="#0f766e"/><text x="654" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Entailed / contradicted /</text><text x="654" y="456" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">unsupported verdicts</text><circle cx="633" cy="496" r="3.6" fill="#0f766e"/><text x="654" y="504" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">An evaluation harness on</text><text x="654" y="534" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">the client's corpus</text><g filter="url(#lift)"><rect x="68" y="612" width="914" height="74" rx="16" fill="#e3f1ef" opacity="0.55"/><rect x="68" y="612" width="914" height="74" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="612" width="914" height="74" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="613" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="100" y="658" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#0f766e" letter-spacing="2.6">OUTPUT</text><text x="236" y="644" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Per answer: the verdict, the derivation or the contradicting rule,</text><text x="236" y="672" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">and the missing assumption named — an audit trail.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">14</text></svg>