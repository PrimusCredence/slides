<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><rect width="1050" height="742" fill="#faf8f3"/><text x="68" y="84" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#a87c00" letter-spacing="3.2">CHAPTER 2</text><text x="68" y="132" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Why now: the attacker industrialised</text><line x1="68" y1="154" x2="178" y2="154" stroke="#a87c00" stroke-width="3"/><text x="68" y="198" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="30" font-weight="600" fill="#14181f" font-style="italic">A sampling defence cannot answer an enumerating attack.</text><rect x="68" y="234" width="291" height="134" rx="12" fill="#f2efe6" stroke="#ddd7c9" stroke-width="1"/><text x="92" y="298" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="50" font-weight="600" fill="#a87c00">4.5×</text><text x="92" y="328" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">revenue of AI-assisted</text><text x="92" y="353" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">scam operations vs.</text><rect x="379" y="234" width="291" height="134" rx="12" fill="#f2efe6" stroke="#ddd7c9" stroke-width="1"/><text x="403" y="298" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="50" font-weight="600" fill="#a87c00">USD 3.52</text><text x="403" y="328" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">compute cost per</text><text x="403" y="353" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">LLM-agent exploit</text><rect x="691" y="234" width="291" height="134" rx="12" fill="#f2efe6" stroke="#ddd7c9" stroke-width="1"/><text x="715" y="298" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="50" font-weight="600" fill="#a87c00">87%</text><text x="715" y="328" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">of a 15-CVE sample</text><text x="715" y="353" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">exploited from the</text><rect x="68" y="408" width="445" height="186" rx="12" fill="#ffffff" stroke="#ddd7c9" stroke-width="1"/><rect x="537" y="408" width="445" height="186" rx="12" fill="#1d5fa8"/><text x="92" y="450" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">TRADITIONAL PEN TEST</text><text x="561" y="450" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#cfe0f7" letter-spacing="2.6">AI-DRIVEN ADVERSARY</text><text x="92" y="494" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">10²–10³ paths, human-selected</text><text x="561" y="494" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">10⁵–10⁷ paths, machine-enumerated</text><text x="92" y="524" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">2–4 week window, then closed</text><text x="561" y="524" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Continuous, no window</text><text x="92" y="554" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">High marginal cost per path</text><text x="561" y="554" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Near-zero marginal cost</text><text x="92" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">“We found no way in”</text><text x="561" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Approaching exhaustive</text><text x="68" y="654" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="500" fill="#a87c00">Proof is the one capability that answers exhaustive search in kind.</text><rect x="0" y="0" width="1050" height="6" fill="#c8940a"/><line x1="68" y1="706" x2="982" y2="706" stroke="#ddd7c9" stroke-width="1"/><text x="68" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#767e8c" letter-spacing="1.4">PrimusCredence</text><text x="525" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#767e8c" text-anchor="middle" letter-spacing="1.4">Why now</text><text x="982" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">03</text></svg>