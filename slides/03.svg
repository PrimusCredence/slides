<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><defs>
<filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
  <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d1b2e" flood-opacity="0.10"/>
</filter>
<filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="70"/>
</filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.70"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
</linearGradient>
<linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#a87c00" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#a87c00" opacity="0.05" filter="url(#bloom)"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Why Now: The Attacker Industrialised</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="184" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="30" font-weight="600" fill="#14181f" font-style="italic">A sampling defence cannot answer an enumerating attack.</text><g filter="url(#lift)"><rect x="68" y="216" width="291" height="158" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="68" y="216" width="291" height="158" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="216" width="291" height="158" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="217" width="263" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="92" y="280" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="48" font-weight="600" fill="#a87c00">4.5×</text><text x="92" y="312" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">revenue of AI-assisted</text><text x="92" y="337" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">scam operations versus</text><text x="92" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">non-AI equivalents</text><g filter="url(#lift)"><rect x="379" y="216" width="291" height="158" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="379" y="216" width="291" height="158" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="379" y="216" width="291" height="158" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="393" y="217" width="263" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="403" y="280" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="48" font-weight="600" fill="#a87c00">$3.52</text><text x="403" y="312" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">average compute cost per</text><text x="403" y="337" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">LLM-agent exploit attempt</text><text x="403" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">on a real CVE</text><g filter="url(#lift)"><rect x="691" y="216" width="291" height="158" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="691" y="216" width="291" height="158" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="691" y="216" width="291" height="158" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="705" y="217" width="263" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="715" y="280" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="48" font-weight="600" fill="#a87c00">87%</text><text x="715" y="312" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">of a 15-CVE sample</text><text x="715" y="337" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">exploited from the public</text><text x="715" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">description alone</text><g filter="url(#lift)"><rect x="68" y="404" width="445" height="188" rx="16" fill="url(#glass)"/><rect x="68" y="404" width="445" height="188" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="405" width="417" height="1.4" rx="0.7" fill="url(#sheen)"/><g filter="url(#lift)"><rect x="537" y="404" width="445" height="188" rx="16" fill="#1d5fa8"/></g><text x="94" y="448" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">TRADITIONAL PEN TEST</text><text x="563" y="448" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#cfe0f7" letter-spacing="2.6">AI-DRIVEN ADVERSARY</text><text x="94" y="492" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">10²–10³ paths, human-selected</text><text x="563" y="492" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">10⁵–10⁷ paths, machine-enumerated</text><text x="94" y="522" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">2–4 week window, then closed</text><text x="563" y="522" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Continuous, no window</text><text x="94" y="552" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">High marginal cost per path</text><text x="563" y="552" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Near-zero marginal cost</text><text x="94" y="582" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">“We found no way in”</text><text x="563" y="582" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">Approaching exhaustive</text><text x="68" y="654" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="500" fill="#a87c00">Proof is the one capability that answers exhaustive search in kind.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">3</text></svg>