<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1187 742" width="1187" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><defs>
<filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0b1a2e" flood-opacity="0.11"/>
  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1a2e" flood-opacity="0.07"/>
</filter>
<filter id="liftsm" x="-30%" y="-40%" width="160%" height="200%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1a2e" flood-opacity="0.09"/>
</filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.99"/>
  <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.93"/>
  <stop offset="1" stop-color="#eef1f7" stop-opacity="0.92"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
  <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.14"/>
  <stop offset="0.47" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
</linearGradient>
<radialGradient id="orb" cx="0.32" cy="0.26" r="0.9">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
  <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
  <stop offset="1" stop-color="#000000" stop-opacity="0.13"/>
</radialGradient>
<linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">OWASP 2025 — Access Control &amp; Misconfiguration</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="176" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f" font-style="italic">The two categories at the top are found in 100% of apps tested.</text><g filter="url(#lift)"><rect x="68" y="206" width="514" height="182" rx="16" fill="#e9eff9" opacity="0.5"/><rect x="68" y="206" width="514" height="182" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="206" width="514" height="182" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="206" width="514" height="182" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="207" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="386" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><g filter="url(#liftsm)"><circle cx="112" cy="250" r="24" fill="#1d5fa8"/><circle cx="112" cy="250" r="24" fill="url(#orb)"/></g><text x="112" y="259" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#ffffff" text-anchor="middle">A01</text><text x="152" y="244" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f">Broken Access Control</text><text x="152" y="274" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#1d5fa8">#1 — unchanged</text><text x="98" y="330" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="400" fill="#4a5260">40 CWEs · 1.84M occurrences · 32,654 CVEs</text><text x="98" y="364" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">SSRF now folded in — easy to exploit, widespread.</text><g filter="url(#lift)"><rect x="606" y="206" width="514" height="182" rx="16" fill="#fbe8f0" opacity="0.5"/><rect x="606" y="206" width="514" height="182" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="606" y="206" width="514" height="182" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="606" y="206" width="514" height="182" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="620" y="207" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="622" y="386" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><g filter="url(#liftsm)"><circle cx="650" cy="250" r="24" fill="#b81f63"/><circle cx="650" cy="250" r="24" fill="url(#orb)"/></g><text x="650" y="259" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#ffffff" text-anchor="middle">A02</text><text x="690" y="244" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f">Security Misconfiguration</text><text x="690" y="274" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#b81f63">#2 — up from #5</text><text x="636" y="330" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="22" font-weight="400" fill="#4a5260">16 CWEs · 719,084 occurrences</text><text x="636" y="364" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">Again, 100% of tested apps carried a form of it.</text><g filter="url(#lift)"><rect x="68" y="408" width="1051" height="236" rx="16" fill="url(#glass)"/><rect x="68" y="408" width="1051" height="236" rx="16" fill="url(#gloss)" opacity="1"/><rect x="68" y="408" width="1051" height="236" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="409" width="1023" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="642" width="1019" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="98" y="446" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">BROKEN ACCESS CONTROL IN THE WILD</text><text x="98" y="486" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">Capital One</text><text x="318" y="486" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#a87c00" text-anchor="end">106M</text><text x="342" y="486" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">WAF SSRF → over-privileged role; a tipster found it, ~4 months in</text><text x="98" y="513" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">Optus</text><text x="318" y="513" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#a87c00" text-anchor="end">9.5M</text><text x="342" y="513" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">access-control bug on a dormant, internet-facing API — latent ~4 years</text><text x="98" y="540" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">T-Mobile</text><text x="318" y="540" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#a87c00" text-anchor="end">37M</text><text x="342" y="540" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">API data retrieval without authorization — ~6 weeks to notice</text><text x="98" y="567" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">Dell</text><text x="318" y="567" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#a87c00" text-anchor="end">49M</text><text x="342" y="567" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">auto-approved fake partner, then service-tag enumeration</text><text x="98" y="594" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">Trello</text><text x="318" y="594" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#a87c00" text-anchor="end">15M</text><text x="342" y="594" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">unauthenticated email lookup through rotating proxies</text><text x="98" y="621" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">Twilio Authy</text><text x="318" y="621" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#a87c00" text-anchor="end">33M</text><text x="342" y="621" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">unauthenticated endpoint enumerated for phone numbers</text><text x="68" y="680" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#a87c00">Every one was a well-formed, authenticated request a monitor read as normal.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">3</text></svg>