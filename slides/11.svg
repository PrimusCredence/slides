  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Services</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="176" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="26" font-weight="600" fill="#14181f" font-style="italic">One method — three services: access control, network isolation, data residency.</text><g filter="url(#lift)"><rect x="68" y="224" width="337" height="344" rx="16" fill="#e9eff9" opacity="0.4"/><rect x="68" y="224" width="337" height="344" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="224" width="337" height="344" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="224" width="337" height="344" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="225" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="566" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="68" y="224" width="6" height="344" rx="3" fill="#1d5fa8"/><g filter="url(#liftsm)"><circle cx="118" cy="272" r="22" fill="#1d5fa8"/><circle cx="118" cy="272" r="22" fill="url(#orb)"/></g><text x="118" y="281" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="24" font-weight="500" fill="#ffffff" text-anchor="middle">1</text><text x="154" y="279" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#1d5fa8" letter-spacing="2.4">ACCESS CONTROL</text><text x="98" y="344" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="24" font-weight="600" fill="#14181f">App entitlement proofs</text><text x="98" y="386" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Every app role, token,</text><text x="98" y="415" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">plugin route and public</text><text x="98" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">user — decided over all</text><text x="98" y="473" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">requests.</text><line x1="98" y1="506" x2="375" y2="506" stroke="#e3e6ec" stroke-width="1"/><text x="98" y="542" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#1d5fa8">Who may do what</text><g filter="url(#lift)"><rect x="425" y="224" width="337" height="344" rx="16" fill="#e9eff9" opacity="0.4"/><rect x="425" y="224" width="337" height="344" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="425" y="224" width="337" height="344" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="425" y="224" width="337" height="344" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="439" y="225" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="441" y="566" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="425" y="224" width="6" height="344" rx="3" fill="#1d5fa8"/><g filter="url(#liftsm)"><circle cx="475" cy="272" r="22" fill="#1d5fa8"/><circle cx="475" cy="272" r="22" fill="url(#orb)"/></g><text x="475" y="281" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="24" font-weight="500" fill="#ffffff" text-anchor="middle">2</text><text x="511" y="279" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#1d5fa8" letter-spacing="2.4">NETWORK ISOLATION</text><text x="455" y="344" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="24" font-weight="600" fill="#14181f">Network segmentation</text><text x="455" y="386" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Routes, security groups,</text><text x="455" y="415" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">firewall and Kubernetes</text><text x="455" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">rules — every path between</text><text x="455" y="473" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">zones.</text><line x1="455" y1="506" x2="732" y2="506" stroke="#e3e6ec" stroke-width="1"/><text x="455" y="542" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#1d5fa8">What traffic can reach where</text><g filter="url(#lift)"><rect x="782" y="224" width="337" height="344" rx="16" fill="#e9eff9" opacity="0.4"/><rect x="782" y="224" width="337" height="344" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="782" y="224" width="337" height="344" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="782" y="224" width="337" height="344" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="796" y="225" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="798" y="566" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="782" y="224" width="6" height="344" rx="3" fill="#1d5fa8"/><g filter="url(#liftsm)"><circle cx="832" cy="272" r="22" fill="#1d5fa8"/><circle cx="832" cy="272" r="22" fill="url(#orb)"/></g><text x="832" y="281" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="24" font-weight="500" fill="#ffffff" text-anchor="middle">3</text><text x="868" y="279" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#1d5fa8" letter-spacing="2.4">DATA RESIDENCY</text><text x="812" y="344" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="24" font-weight="600" fill="#14181f">Residency proofs</text><text x="812" y="386" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Backups, replicas, keys,</text><text x="812" y="415" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">caches — not where data</text><text x="812" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">is, but where it can go.</text><line x1="812" y1="506" x2="1089" y2="506" stroke="#e3e6ec" stroke-width="1"/><text x="812" y="542" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#1d5fa8">Where regulated data can go</text><g filter="url(#lift)"><rect x="68" y="596" width="1051" height="60" rx="16" fill="#f6efdd" opacity="0.5"/><rect x="68" y="596" width="1051" height="60" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="596" width="1051" height="60" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="596" width="1051" height="60" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="597" width="1023" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="654" width="1019" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="98" y="633" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#a87c00" letter-spacing="2.4">EVERY SERVICE ENDS</text><text x="344" y="633" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="500" fill="#14181f">in a proof — or the exact request, path or chain that breaks it.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">11</text></svg>