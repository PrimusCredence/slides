<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="399" fill="url(#bl-cyb)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="560" cy="380" r="494" fill="url(#bl-cyb)" opacity="0.05"/><text x="68" y="110" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">3. API-Usage Conformance</text><rect x="68" y="126" width="112" height="4" rx="2" fill="#1d5fa8"/><g filter="url(#lift)"><rect x="68" y="152" width="914" height="86" rx="16" fill="#e9eff9" opacity="0.55"/><rect x="68" y="152" width="914" height="86" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="152" width="914" height="86" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="152" width="914" height="86" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="153" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="236" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="70" y="164" width="5" height="62" rx="2.5" fill="#1d5fa8"/><text x="102" y="192" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Does our own code use the platform, credential and crypto SDKs</text><text x="102" y="226" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">the way their contracts require?</text><text x="68" y="292" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">Cloud APIs are protocols, not function</text><text x="68" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">calls. Undrained pagination, a logged</text><text x="68" y="394" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">credential, an unsanitised response — all</text><text x="68" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">compile and pass review.</text><line x1="68" y1="472" x2="568" y2="472" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="500" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">A correct policy invoked through a misused</text><text x="68" y="530" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">SDK still leaks. Bounded by the library.</text><text x="68" y="566" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">PRECEDENT</text><text x="208" y="566" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">AWS RAPID → CodeGuru · 76% accepted</text><text x="68" y="596" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">BUYERS</text><text x="208" y="596" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Platform and AppSec teams · ISVs</text><g filter="url(#lift)"><rect x="602" y="262" width="380" height="314" rx="18" fill="url(#glass)"/><rect x="602" y="262" width="380" height="314" rx="18" fill="url(#gloss)" opacity="1"/><rect x="602" y="262" width="380" height="314" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="616" y="263" width="352" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="618" y="574" width="348" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="628" y="304" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">WHAT WE BUILD</text><circle cx="633" cy="340" r="3.6" fill="#1d5fa8"/><text x="654" y="348" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Pattern libraries per SDK,</text><text x="654" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">versioned per release</text><circle cx="633" cy="418" r="3.6" fill="#1d5fa8"/><text x="654" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">A conformance gate for</text><text x="654" y="456" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">library publishers</text><circle cx="633" cy="496" r="3.6" fill="#1d5fa8"/><text x="654" y="504" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">PR-gate CI on Soot, CodeQL</text><text x="654" y="534" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">and Infer</text><g filter="url(#lift)"><rect x="68" y="612" width="914" height="74" rx="16" fill="#e9eff9" opacity="0.55"/><rect x="68" y="612" width="914" height="74" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="612" width="914" height="74" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="612" width="914" height="74" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="613" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="684" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="100" y="658" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#1d5fa8" letter-spacing="2.6">OUTPUT</text><text x="236" y="644" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">The call site, the taint trace, the pattern violated and the</text><text x="236" y="672" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">corrected call sequence — plus which patterns were checked.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">10</text></svg>