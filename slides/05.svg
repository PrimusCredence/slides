</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#a87c00" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#a87c00" opacity="0.05" filter="url(#bloom)"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="45" font-weight="600" fill="#14181f">We Add a Layer to Your Stack, NOT Replace It</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><g filter="url(#lift)"><rect x="68" y="176" width="914" height="194" rx="18" fill="url(#glass)"/><rect x="68" y="176" width="914" height="194" rx="18" fill="url(#gloss)" opacity="1"/><rect x="68" y="176" width="914" height="194" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="177" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="368" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="98" y="214" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">WHAT YOUR STACK ANSWERS TODAY</text><g filter="url(#liftsm)"><rect x="252" y="234" width="228" height="40" rx="20.0" fill="#ffffff"/><rect x="252" y="234" width="228" height="40" rx="20.0" fill="url(#gloss)" opacity="0.8"/><rect x="252" y="234" width="228" height="40" rx="20.0" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><text x="270" y="261" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Pen test &amp; red team</text><g filter="url(#liftsm)"><rect x="492" y="234" width="147" height="40" rx="20.0" fill="#ffffff"/><rect x="492" y="234" width="147" height="40" rx="20.0" fill="url(#gloss)" opacity="0.8"/><rect x="492" y="234" width="147" height="40" rx="20.0" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><text x="510" y="261" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">CSPM / CIEM</text><g filter="url(#liftsm)"><rect x="651" y="234" width="147" height="40" rx="20.0" fill="#ffffff"/><rect x="651" y="234" width="147" height="40" rx="20.0" fill="url(#gloss)" opacity="0.8"/><rect x="651" y="234" width="147" height="40" rx="20.0" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><text x="669" y="261" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">ASPM / SAST</text><g filter="url(#liftsm)"><rect x="281" y="286" width="278" height="40" rx="20.0" fill="#ffffff"/><rect x="281" y="286" width="278" height="40" rx="20.0" fill="url(#gloss)" opacity="0.8"/><rect x="281" y="286" width="278" height="40" rx="20.0" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><text x="299" y="313" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Vulnerability management</text><g filter="url(#liftsm)"><rect x="571" y="286" width="197" height="40" rx="20.0" fill="#ffffff"/><rect x="571" y="286" width="197" height="40" rx="20.0" fill="url(#gloss)" opacity="0.8"/><rect x="571" y="286" width="197" height="40" rx="20.0" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><text x="589" y="313" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">SOC · EDR · SIEM</text><text x="98" y="352" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#767e8c" font-style="italic">“We looked, and within the time available we did not find a way in.”</text><g filter="url(#lift)"><rect x="68" y="392" width="914" height="132" rx="18" fill="#f6efdd" opacity="0.55"/><rect x="68" y="392" width="914" height="132" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="68" y="392" width="914" height="132" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="392" width="914" height="132" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="393" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="522" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="70" y="406" width="5" height="104" rx="2.5" fill="#c8940a"/><text x="102" y="430" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" letter-spacing="2.6">WHAT WE ADD</text><text x="102" y="470" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="30" font-weight="600" fill="#14181f">“No way it exists — over the whole modelled space.”</text><text x="102" y="502" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">A preventive control with evidence behind it, re-run on every change.</text><text x="68" y="572" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">WHAT STAYS WITH YOU</text><text x="68" y="606" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Configuration drift, shadow</text><text x="68" y="632" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">assets and anything outside</text><text x="68" y="658" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">the model</text><text x="379" y="606" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Insider misuse, and valid</text><text x="379" y="632" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">credentials used exactly as</text><text x="379" y="658" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">intended</text><text x="691" y="606" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Detection, response and the</text><text x="691" y="632" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">rest of the programme you</text><text x="691" y="658" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">already run</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">5</text></svg>