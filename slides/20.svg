</linearGradient>
</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#a87c00" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#a87c00" opacity="0.05" filter="url(#bloom)"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">What a Provider Can Resell</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="184" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f" font-style="italic">We do not certify — so an audit firm or an MSSP is a channel, not a rival.</text><g filter="url(#lift)"><rect x="68" y="214" width="914" height="82" rx="16" fill="url(#glass)"/><rect x="68" y="214" width="914" height="82" rx="16" fill="url(#gloss)" opacity="1"/><rect x="68" y="214" width="914" height="82" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="215" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="294" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="98" y="262" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#767e8c">Scanning · posture reporting · monitoring</text><path d="M544,254 l34,0 M570,246 l8,8 -8,8" stroke="#c8940a" stroke-width="2.5" fill="none"/><text x="952" y="262" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#a87c00" text-anchor="end">Provable control effectiveness</text><text x="68" y="356" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#a87c00" letter-spacing="3.2">THE COMMERCIAL MOVE</text><circle cx="73" cy="398" r="3.6" fill="#c8940a"/><text x="94" y="406" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">Specialist capability inside bids</text><text x="94" y="439" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">you already win</text><circle cx="73" cy="490" r="3.6" fill="#c8940a"/><text x="94" y="498" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">You keep the client relationship and</text><text x="94" y="531" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">the contract</text><g filter="url(#lift)"><rect x="572" y="330" width="410" height="214" rx="18" fill="#f6efdd" opacity="0.4"/><rect x="572" y="330" width="410" height="214" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="572" y="330" width="410" height="214" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="572" y="330" width="410" height="214" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="586" y="331" width="382" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="588" y="542" width="378" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="598" y="374" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#a87c00" letter-spacing="3.2">WHY IT DEPLOYS EASILY</text><circle cx="603" cy="408" r="3.6" fill="#c8940a"/><text x="624" y="416" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Read-only access, no agent</text><text x="624" y="447" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">on any host</text><circle cx="603" cy="496" r="3.6" fill="#c8940a"/><text x="624" y="504" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">No scanning window, no</text><text x="624" y="535" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">production traffic</text><text x="68" y="622" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#a87c00">Read-only and agentless, so it clears change advisory in one pass.</text><text x="68" y="656" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#a87c00">We produce the technical evidence. Your assessor keeps the opinion.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">20</text></svg>