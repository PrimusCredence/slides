<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><defs>
<filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0b1a2e" flood-opacity="0.11"/>
  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1a2e" flood-opacity="0.07"/>
</filter>
<filter id="liftsm" x="-30%" y="-40%" width="160%" height="200%">
