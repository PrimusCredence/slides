<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><defs>
<filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
  <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d1b2e" flood-opacity="0.10"/>
</filter>
<filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="70"/>
</filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.70"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
</linearGradient>
<linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#1d5fa8" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#1d5fa8" opacity="0.05" filter="url(#bloom)"/><text x="68" y="110" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="44" font-weight="600" fill="#14181f">2. Network Reachability &amp; Segmentation Proofs</text><rect x="68" y="126" width="112" height="4" rx="2" fill="#1d5fa8"/><g filter="url(#lift)"><rect x="68" y="152" width="914" height="86" rx="16" fill="#e9eff9" opacity="0.55"/><rect x="68" y="152" width="914" height="86" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="152" width="914" height="86" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="153" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="70" y="164" width="5" height="62" rx="2.5" fill="#1d5fa8"/><text x="102" y="192" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Does any path exist from an untrusted zone to this subnet — and</text><text x="102" y="226" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">does east-west segmentation hold?</text><text x="68" y="292" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">Probing tests the paths you thought of,</text><text x="68" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">at the moment you ran it. Reachability is</text><text x="68" y="394" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">a property of the configuration, not of</text><text x="68" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">the packets sent.</text><line x1="68" y1="476" x2="568" y2="476" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="508" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">Static: no scanning window, no production</text><text x="68" y="538" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">traffic — it re-runs on every change.</text><text x="68" y="578" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">PRECEDENT</text><text x="208" y="578" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">AWS Tiros → VPC Reachability Analyzer</text><text x="68" y="612" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">BUYERS</text><text x="208" y="612" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">Sovereign cloud · banks · OT · telcos</text><g filter="url(#lift)"><rect x="602" y="262" width="380" height="314" rx="18" fill="url(#glass)"/><rect x="602" y="262" width="380" height="314" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="616" y="263" width="352" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="628" y="304" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">WHAT WE BUILD</text><circle cx="633" cy="340" r="3.6" fill="#1d5fa8"/><text x="654" y="348" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Batfish models of the</text><text x="654" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">hybrid and on-prem estate</text><circle cx="633" cy="418" r="3.6" fill="#1d5fa8"/><text x="654" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Soufflé and Z3 engines for</text><text x="654" y="456" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">cloud topologies</text><circle cx="633" cy="496" r="3.6" fill="#1d5fa8"/><text x="654" y="504" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Microsegmentation vs. the</text><text x="654" y="534" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">declared policy</text><g filter="url(#lift)"><rect x="68" y="612" width="914" height="74" rx="16" fill="#e9eff9" opacity="0.55"/><rect x="68" y="612" width="914" height="74" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="612" width="914" height="74" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="613" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="100" y="658" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#1d5fa8" letter-spacing="2.6">OUTPUT</text><text x="236" y="644" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">A proof that no path exists — or the path, hop by hop, with the</text><text x="236" y="672" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">rule that permits it and the owner of that rule.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">8</text></svg>