<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><rect width="1050" height="742" fill="#faf8f3"/><text x="68" y="84" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="17" font-weight="500" fill="#b81f63" letter-spacing="3.2">SOLUTION 9  ·  CRYPTO SECURITY SOLUTIONS</text><text x="68" y="132" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="45" font-weight="600" fill="#14181f">Formal verification of distributed protocols</text><line x1="68" y1="154" x2="178" y2="154" stroke="#b81f63" stroke-width="3"/><rect x="68" y="172" width="914" height="84" rx="12" fill="#fbe8f0"/><rect x="68" y="172" width="5" height="84" rx="2.5" fill="#b81f63"/><text x="100" y="212" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Does this protocol admit an execution that breaks safety under</text><text x="100" y="246" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Byzantine faults, asynchrony or partition?</text><text x="68" y="308" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#b81f63" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="346" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">These are design defects: no CVE, no</text><text x="68" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">patch, no signature, present from the</text><text x="68" y="410" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">first commit. One AWS TLA+ finding needed</text><text x="68" y="442" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">a 35-step sequence.</text><line x1="68" y1="492" x2="568" y2="492" stroke="#ddd7c9" stroke-width="1"/><text x="68" y="524" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">Bridges: USD 2.8bn lost, ~40% of all Web3</text><text x="68" y="554" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">losses — and verification is thin.</text><text x="68" y="592" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">PRECEDENT</text><text x="208" y="592" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">Pipelined Moonshot in IVy · FMBC 2024</text><rect x="602" y="282" width="380" height="304" rx="12" fill="#ffffff" stroke="#ddd7c9" stroke-width="1"/><text x="628" y="322" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#b81f63" letter-spacing="3.2">WHAT WE BUILD</text><circle cx="633" cy="358" r="3.6" fill="#b81f63"/><text x="654" y="366" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">IVy in decidable EPR:</text><text x="654" y="396" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">proof or counterexample</text><circle cx="633" cy="436" r="3.6" fill="#b81f63"/><text x="654" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Dafny and IronFleet; TLA+</text><text x="654" y="474" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">with TLC and TLAPS</text><circle cx="633" cy="514" r="3.6" fill="#b81f63"/><text x="654" y="522" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Cross-chain bridges — a</text><text x="654" y="552" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">genuine white space</text><rect x="68" y="606" width="914" height="88" rx="12" fill="#fbe8f0"/><rect x="68" y="606" width="5" height="88" rx="2.5" fill="#b81f63"/><text x="100" y="640" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#b81f63" letter-spacing="2.6">OUTPUT</text><text x="236" y="640" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Machine-checked inductive invariants with the fault, adversary</text><text x="236" y="669" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">and network assumptions stated — or the breaking execution.</text><rect x="0" y="0" width="1050" height="6" fill="#c8940a"/><rect x="0" y="0" width="441" height="6" fill="#b81f63"/><line x1="68" y1="706" x2="982" y2="706" stroke="#ddd7c9" stroke-width="1"/><text x="68" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#767e8c" letter-spacing="1.4">Buyers: L1/L2 teams · bridges · settlement</text><text x="982" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">17</text></svg>