<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-ai)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-ai)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">AI Agents Multiply Faster Than the Rules</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#0f766e"/><text x="68" y="176" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="24" font-weight="600" fill="#14181f" font-style="italic">An agent is a non-human identity with delegated privilege and a writable channel.</text><g filter="url(#lift)"><rect x="68" y="210" width="514" height="328" rx="18" fill="#e3f1ef" opacity="0.4"/><rect x="68" y="210" width="514" height="328" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="68" y="210" width="514" height="328" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="210" width="514" height="328" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="211" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="536" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="250" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#0f766e" letter-spacing="3.2">THE RULES ARE ARRIVING</text><circle cx="99" cy="286" r="3.6" fill="#0f766e"/><text x="120" y="294" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">EU AI Act — Art. 15 robustness &amp; security</text><circle cx="99" cy="326" r="3.6" fill="#0f766e"/><text x="120" y="334" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">ISO/IEC 42001 — AI management system</text><circle cx="99" cy="366" r="3.6" fill="#0f766e"/><text x="120" y="374" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">ISO/IEC 24029-2 — formal methods for AI</text><circle cx="99" cy="406" r="3.6" fill="#0f766e"/><text x="120" y="414" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">DIFC Reg 10 · Dubai AI Seal · SDAIA</text><line x1="94" y1="474" x2="556" y2="474" stroke="#e3e6ec" stroke-width="1"/><text x="94" y="498" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00" font-style="italic">The assurance market does not exist yet —</text><text x="94" y="522" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00" font-style="italic">anywhere. You would be early, not late.</text><g filter="url(#lift)"><rect x="606" y="210" width="514" height="328" rx="18" fill="url(#glass)"/><rect x="606" y="210" width="514" height="328" rx="18" fill="url(#gloss)" opacity="1"/><rect x="606" y="210" width="514" height="328" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="620" y="211" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="622" y="536" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="632" y="250" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="17" font-weight="500" fill="#0f766e" letter-spacing="3.2">THE CHALLENGE — GUARDRAILS ESCAPE</text><text x="632" y="292" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">A guard model judging a model is</text><text x="632" y="321" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">detective, not preventive. The question</text><text x="632" y="350" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">is not “how often does it fail?” but “can</text><text x="632" y="379" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">it do this at all?”</text><line x1="632" y1="412" x2="1093" y2="412" stroke="#e3e6ec" stroke-width="1"/><g filter="url(#liftsm)"><circle cx="650" cy="444" r="15" fill="#0f766e"/><circle cx="650" cy="444" r="15" fill="url(#orb)"/></g><text x="650" y="450" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">5</text><text x="678" y="452" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="600" fill="#14181f">What an agent may do</text><text x="678" y="478" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">tool calls, arguments, data access</text><g filter="url(#lift)"><rect x="68" y="558" width="1051" height="74" rx="16" fill="#0f766e"/><rect x="68" y="558" width="1051" height="74" rx="16" fill="url(#gloss)" opacity="0.14"/><rect x="69" y="559" width="1049" height="72" rx="15" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.22"/></g><text x="594" y="603" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Our AI-agentic guardrail solution proves the mediation layer, not the model  →</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">17</text></svg>