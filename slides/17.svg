  <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
  <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
  <stop offset="1" stop-color="#000000" stop-opacity="0.13"/>
</radialGradient>
