  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#b81f63" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#b81f63" opacity="0.05" filter="url(#bloom)"/><text x="68" y="110" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="42" font-weight="600" fill="#14181f">9. Formal Verification of Distributed Protocols</text><rect x="68" y="126" width="112" height="4" rx="2" fill="#b81f63"/><g filter="url(#lift)"><rect x="68" y="152" width="914" height="86" rx="16" fill="#fbe8f0" opacity="0.55"/><rect x="68" y="152" width="914" height="86" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="152" width="914" height="86" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="153" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="70" y="164" width="5" height="62" rx="2.5" fill="#b81f63"/><text x="102" y="192" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Does this protocol admit an execution that breaks safety under</text><text x="102" y="226" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Byzantine faults, asynchrony or partition?</text><text x="68" y="292" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#b81f63" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">These are design defects: no CVE, no</text><text x="68" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">patch, no signature, present from the</text><text x="68" y="394" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">first commit. One AWS TLA+ finding needed</text><text x="68" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">a 35-step sequence.</text><line x1="68" y1="492" x2="568" y2="492" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="528" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">PRECEDENT</text><text x="208" y="528" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">Pipelined Moonshot in IVy · FMBC 2024</text><text x="68" y="562" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">BUYERS</text><text x="208" y="562" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">L1/L2 teams · settlement infrastructure</text><g filter="url(#lift)"><rect x="602" y="262" width="380" height="314" rx="18" fill="url(#glass)"/><rect x="602" y="262" width="380" height="314" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="616" y="263" width="352" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="628" y="304" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#b81f63" letter-spacing="3.2">WHAT WE BUILD</text><circle cx="633" cy="340" r="3.6" fill="#b81f63"/><text x="654" y="348" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">IVy in decidable EPR:</text><text x="654" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">proof or counterexample</text><circle cx="633" cy="418" r="3.6" fill="#b81f63"/><text x="654" y="426" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Dafny and IronFleet; TLA+</text><text x="654" y="456" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">with TLC and TLAPS</text><circle cx="633" cy="496" r="3.6" fill="#b81f63"/><text x="654" y="504" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Coq/Rocq for consensus and</text><text x="654" y="534" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">replication safety</text><g filter="url(#lift)"><rect x="68" y="612" width="914" height="74" rx="16" fill="#fbe8f0" opacity="0.55"/><rect x="68" y="612" width="914" height="74" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="612" width="914" height="74" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="613" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><text x="100" y="658" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#b81f63" letter-spacing="2.6">OUTPUT</text><text x="236" y="644" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Machine-checked inductive invariants with the fault, adversary and</text><text x="236" y="672" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">network assumptions stated — or the breaking execution.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">17</text></svg>