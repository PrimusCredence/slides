</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#a87c00" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#a87c00" opacity="0.05" filter="url(#bloom)"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Take Away</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><g filter="url(#lift)"><rect x="68" y="174" width="914" height="106" rx="18" fill="#14181f"/></g><text x="525" y="222" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="33" font-weight="600" fill="#ffffff" text-anchor="middle">Mathematical rigour to security —</text><text x="525" y="264" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="33" font-weight="600" fill="#c8940a" text-anchor="middle">proof alongside testing, across cloud, AI and crypto.</text><rect x="68" y="320" width="279" height="3" rx="1.5" fill="#c8940a"/><text x="68" y="364" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">The shift</text><text x="68" y="404" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Attack path discovery is</text><text x="68" y="433" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">automated, parallel and</text><text x="68" y="462" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">cheap. A defence that</text><text x="68" y="491" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">only samples cannot</text><text x="68" y="520" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">answer one that</text><text x="68" y="549" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">enumerates.</text><rect x="381" y="320" width="279" height="3" rx="1.5" fill="#c8940a"/><text x="381" y="364" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">The addition</text><text x="381" y="404" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">We do not replace</text><text x="381" y="433" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">testing, monitoring or</text><text x="381" y="462" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">the SOC. We make one</text><text x="381" y="491" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">class of controls machine</text><text x="381" y="520" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">checkable.</text><rect x="693" y="320" width="279" height="3" rx="1.5" fill="#c8940a"/><text x="693" y="364" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">The honesty</text><text x="693" y="404" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">A proof is relative to a</text><text x="693" y="433" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">model and a specification</text><text x="693" y="462" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">— both stated. We produce</text><text x="693" y="491" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">the evidence; we do not</text><text x="693" y="520" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">certify.</text><g filter="url(#lift)"><rect x="68" y="566" width="914" height="112" rx="18" fill="#f6efdd" opacity="0.5"/><rect x="68" y="566" width="914" height="112" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="68" y="566" width="914" height="112" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="567" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="70" y="580" width="5" height="84" rx="2.5" fill="#c8940a"/><text x="102" y="606" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" letter-spacing="2.4">START HERE — MICRO ASSESSMENT OF SOLUTION 1</text><text x="102" y="640" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">One narrow, high-risk slice. Read-only access, no agent deployed,</text><text x="102" y="668" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">weeks not months — and a counter-example on your own systems, or a proof.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">18</text></svg>