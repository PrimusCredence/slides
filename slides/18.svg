<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><rect width="1050" height="742" fill="#faf8f3"/><text x="68" y="84" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#a87c00" letter-spacing="3.2">TAKE AWAY</text><text x="68" y="132" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">What to take away</text><line x1="68" y1="154" x2="178" y2="154" stroke="#a87c00" stroke-width="3"/><rect x="68" y="182" width="914" height="106" rx="14" fill="#14181f"/><text x="525" y="230" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="33" font-weight="600" fill="#ffffff" text-anchor="middle">Mathematical rigour to security —</text><text x="525" y="272" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="33" font-weight="600" fill="#c8940a" text-anchor="middle">proof alongside testing, across cloud, AI and crypto.</text><line x1="68" y1="330" x2="347" y2="330" stroke="#c8940a" stroke-width="2"/><text x="68" y="372" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">The shift</text><text x="68" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Attack path discovery is</text><text x="68" y="441" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">automated, parallel and</text><text x="68" y="470" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">cheap. A defence that</text><text x="68" y="499" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">only samples cannot</text><text x="68" y="528" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">answer one that</text><text x="68" y="557" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">enumerates.</text><line x1="381" y1="330" x2="659" y2="330" stroke="#c8940a" stroke-width="2"/><text x="381" y="372" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">The addition</text><text x="381" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">We do not replace</text><text x="381" y="441" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">testing, monitoring or</text><text x="381" y="470" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">the SOC. We make one</text><text x="381" y="499" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">class of control</text><text x="381" y="528" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">statement decidable, not</text><text x="381" y="557" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">sampled.</text><line x1="693" y1="330" x2="972" y2="330" stroke="#c8940a" stroke-width="2"/><text x="693" y="372" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">The honesty</text><text x="693" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">A proof is relative to a</text><text x="693" y="441" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">model and a specification</text><text x="693" y="470" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">— both stated. We produce</text><text x="693" y="499" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">the evidence; we do not</text><text x="693" y="528" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">certify.</text><rect x="68" y="578" width="914" height="112" rx="14" fill="#f2efe6" stroke="#ddd7c9" stroke-width="1"/><rect x="68" y="578" width="5" height="112" rx="2.5" fill="#c8940a"/><text x="98" y="614" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" letter-spacing="2.4">START HERE — MILESTONE 1: THE MICRO-PROOF ASSESSMENT</text><text x="98" y="650" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">One narrow, high-risk slice. Read-only access, no agent deployed,</text><text x="98" y="678" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">weeks not months — and a counter-example on your own systems, or a proof.</text><rect x="0" y="0" width="1050" height="6" fill="#c8940a"/><line x1="68" y1="706" x2="982" y2="706" stroke="#ddd7c9" stroke-width="1"/><text x="68" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#767e8c" letter-spacing="1.4">PrimusCredence</text><text x="525" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#767e8c" text-anchor="middle" letter-spacing="1.4">Take away</text><text x="982" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">18</text></svg>