<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="560" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Why Your Clients Will Ask</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="184" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="30" font-weight="600" fill="#14181f" font-style="italic">Four things happened at once in the GCC.</text><g filter="url(#lift)"><rect x="68" y="214" width="447" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="68" y="214" width="447" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="214" width="447" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="214" width="447" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="215" width="419" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="318" width="415" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="256" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#14181f">Mandatory replaced voluntary</text><text x="94" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">UAE cyber-resilience obligations now</text><text x="94" y="316" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">carry penalties of AED 100k–3m.</text><g filter="url(#lift)"><rect x="535" y="214" width="447" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="535" y="214" width="447" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="535" y="214" width="447" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="535" y="214" width="447" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="549" y="215" width="419" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="551" y="318" width="415" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="561" y="256" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#14181f">A regulator named the technique</text><text x="561" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">VARA expects formal verification where</text><text x="561" y="316" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">applicable for smart contracts.</text><g filter="url(#lift)"><rect x="68" y="336" width="447" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="68" y="336" width="447" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="336" width="447" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="336" width="447" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="337" width="419" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="440" width="415" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#14181f">AI rules arrived before AI assurance</text><text x="94" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Risk-tiered obligations demand evidence</text><text x="94" y="438" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">the market cannot yet produce.</text><g filter="url(#lift)"><rect x="535" y="336" width="447" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="535" y="336" width="447" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="535" y="336" width="447" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="535" y="336" width="447" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="549" y="337" width="419" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="551" y="440" width="415" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="561" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#14181f">Sovereignty is a reachability question</text><text x="561" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Localisation asks whether regulated</text><text x="561" y="438" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">data can leave. Solution 2 settles it.</text><g filter="url(#lift)"><rect x="68" y="470" width="914" height="172" rx="18" fill="url(#glass)"/><rect x="68" y="470" width="914" height="172" rx="18" fill="url(#gloss)" opacity="1"/><rect x="68" y="470" width="914" height="172" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="471" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="640" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="98" y="508" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">WHERE A FINDING ALSO LANDS</text><text x="98" y="550" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">DESC ISR</text><text x="339" y="550" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="383" y="550" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">NESA / UAE IAS</text><text x="623" y="550" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">2 4</text><text x="667" y="550" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">UAE PDPL</text><text x="908" y="550" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">2 3 6</text><text x="98" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">SAMA CSF</text><text x="339" y="584" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3 6</text><text x="383" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">NCA ECC</text><text x="623" y="584" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3 4</text><text x="667" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">VARA</text><text x="908" y="584" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">8</text><text x="98" y="618" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">UAE AI Act</text><text x="339" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">6 7</text><text x="383" y="618" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">ISO 27001</text><text x="623" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3 5</text><text x="667" y="618" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">NIST CSF 2.0</text><text x="908" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1–5</text><text x="68" y="680" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#767e8c" font-style="italic">Regulation routes the finding to a second reader. It is not the reason to commission it.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">19</text></svg>