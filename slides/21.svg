</defs><rect width="1050" height="742" fill="#ffffff"/><circle cx="880" cy="110" r="210" fill="#a87c00" opacity="0.16" filter="url(#bloom)"/><circle cx="130" cy="665" r="230" fill="#c8940a" opacity="0.13" filter="url(#bloom)"/><circle cx="560" cy="380" r="260" fill="#a87c00" opacity="0.05" filter="url(#bloom)"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">One Result, Three Registers</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><g filter="url(#lift)"><rect x="68" y="186" width="291" height="324" rx="18" fill="url(#glass)"/><rect x="68" y="186" width="291" height="324" rx="18" fill="url(#gloss)" opacity="1"/><rect x="68" y="186" width="291" height="324" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="187" width="263" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="508" width="259" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="94.0" y="218" width="46" height="4" rx="2" fill="#c8940a"/><text x="94" y="264" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">First line</text><text x="94" y="296" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00">Engineering and security</text><text x="94" y="321" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00">operations</text><text x="94" y="360" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">The property, its</text><text x="94" y="388" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">model and assumptions,</text><text x="94" y="416" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">and either the proof</text><text x="94" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">or a reproducible</text><text x="94" y="472" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">attack path.</text><g filter="url(#lift)"><rect x="379" y="186" width="291" height="324" rx="18" fill="url(#glass)"/><rect x="379" y="186" width="291" height="324" rx="18" fill="url(#gloss)" opacity="1"/><rect x="379" y="186" width="291" height="324" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="393" y="187" width="263" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="395" y="508" width="259" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="405.3333333333333" y="218" width="46" height="4" rx="2" fill="#c8940a"/><text x="405" y="264" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">Second line</text><text x="405" y="296" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00">Risk</text><text x="405" y="360" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Likelihood moved off a</text><text x="405" y="388" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">qualitative guess,</text><text x="405" y="416" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">with residual risk and</text><text x="405" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">the model's limits</text><text x="405" y="472" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">stated.</text><g filter="url(#lift)"><rect x="691" y="186" width="291" height="324" rx="18" fill="url(#glass)"/><rect x="691" y="186" width="291" height="324" rx="18" fill="url(#gloss)" opacity="1"/><rect x="691" y="186" width="291" height="324" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="705" y="187" width="263" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="707" y="508" width="259" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="716.6666666666666" y="218" width="46" height="4" rx="2" fill="#c8940a"/><text x="717" y="264" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="29" font-weight="600" fill="#14181f">Third line</text><text x="717" y="296" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00">Internal audit and</text><text x="717" y="321" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#a87c00">compliance</text><text x="717" y="360" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">A clause-mapped</text><text x="717" y="388" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">control assertion:</text><text x="717" y="416" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">objective, status,</text><text x="717" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">owner and</text><text x="717" y="472" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">re-verification date.</text><g filter="url(#lift)"><rect x="68" y="546" width="914" height="88" rx="16" fill="#f6efdd" opacity="0.5"/><rect x="68" y="546" width="914" height="88" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="546" width="914" height="88" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="546" width="914" height="88" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="547" width="886" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="632" width="882" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><path d="M102,590 l9,9 15,-19" stroke="#c8940a" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="598" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Design → operating effectiveness · attaches to your GRC records · assessors probe less</text><text x="68" y="674" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#767e8c" font-style="italic">The first register is the product. The second and third make it worth more than it cost.</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">21</text></svg>