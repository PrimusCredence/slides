<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 742" width="1050" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><rect width="1050" height="742" fill="#faf8f3"/><text x="68" y="84" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#0f766e" letter-spacing="3.2">SOLUTION 6  ·  AI SECURITY SOLUTIONS</text><text x="68" y="132" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">AI and LLM guardrail verification</text><line x1="68" y1="154" x2="178" y2="154" stroke="#0f766e" stroke-width="3"/><rect x="68" y="172" width="914" height="84" rx="12" fill="#e3f1ef"/><rect x="68" y="172" width="5" height="84" rx="2.5" fill="#0f766e"/><text x="100" y="224" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Not “how often does the agent fail?” but “can it do this at all?”</text><text x="68" y="308" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#0f766e" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="346" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">An agent is a non-human identity with</text><text x="68" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">delegated privilege and an instruction</text><text x="68" y="410" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">channel the adversary can write to. A</text><text x="68" y="442" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">guard model judging a model is detective,</text><text x="68" y="474" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#4a5260">not preventive.</text><line x1="68" y1="492" x2="568" y2="492" stroke="#ddd7c9" stroke-width="1"/><text x="68" y="524" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">Provable: no rows outside the caller's ACL.</text><text x="68" y="554" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#a87c00" font-style="italic">Not provable: no PII ever reaches the user.</text><text x="68" y="592" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#767e8c" letter-spacing="2.4">PRECEDENT</text><text x="208" y="592" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#4a5260">Bedrock Automated Reasoning · detect mode</text><rect x="602" y="282" width="380" height="304" rx="12" fill="#ffffff" stroke="#ddd7c9" stroke-width="1"/><text x="628" y="322" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#0f766e" letter-spacing="3.2">WHAT WE BUILD</text><circle cx="633" cy="358" r="3.6" fill="#0f766e"/><text x="654" y="366" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Tool-call constraints over</text><text x="654" y="396" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">identity and arguments</text><circle cx="633" cy="436" r="3.6" fill="#0f766e"/><text x="654" y="444" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Data-access boundaries in</text><text x="654" y="474" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">the Solution 1 logic</text><circle cx="633" cy="514" r="3.6" fill="#0f766e"/><text x="654" y="522" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Composition safety across</text><text x="654" y="552" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">call sequences</text><rect x="68" y="606" width="914" height="88" rx="12" fill="#e3f1ef"/><rect x="68" y="606" width="5" height="88" rx="2.5" fill="#0f766e"/><text x="100" y="640" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#0f766e" letter-spacing="2.6">OUTPUT</text><text x="236" y="640" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">A result about the mediation layer, not the model: nothing</text><text x="236" y="669" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">permitted escapes the envelope, and no path bypasses it.</text><rect x="0" y="0" width="1050" height="6" fill="#c8940a"/><rect x="0" y="0" width="441" height="6" fill="#0f766e"/><line x1="68" y1="706" x2="982" y2="706" stroke="#ddd7c9" stroke-width="1"/><text x="68" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="400" fill="#767e8c" letter-spacing="1.4">Buyers: Banks · sovereign AI · OT · healthcare</text><text x="982" y="730" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">13</text></svg>