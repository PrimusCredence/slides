563" y="614" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">reproducible on your estate.</text><text x="68" y="664" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#767e8c">Industrial practice: AWS (Zelkova, Tiros, Nitro) · Microsoft (Z3) · Meta (Infer) · Airbus (Astrée)</text><line x1="68" y1="700" x2="982" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="982" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">4</text></svg>