rial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Batfish, IVy</text><text x="558" y="390" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">and TLA+ search</text><text x="558" y="418" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">it all</text><path d="M752,330 l11,0 M758,325 l5,5 -5,5" stroke="#c8940a" stroke-width="2" fill="none"/><rect x="767" y="236" width="215" height="190" rx="12" fill="#ffffff" stroke="#ddd7c9" stroke-width="1"/><circle cx="809" cy="274" r="19" fill="#c8940a"/><text x="809" y="283" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#ffffff" text-anchor="middle">4</text><text x="839" y="283" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f">Report</text><text x="791" y="334" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">A proof, or a</text><text x="791" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">reproducible</text><text x="791" y="390" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">attack path</text><rect x="68" y="456" width="445" height="156" rx="12" fill="#eaf4ee" stroke="#bcd8c7" stroke-width="1"/><rect x="537" y="456" width="445" height="156" rx="12" fill="#fbeee6" stroke="#e8cdb6" stroke-width="1"/><text x="92" y="502" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="30" font-weight="500" fill="#2f7d4f">UNSAT</text><text x="92" y="542" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">No violating state exists — over</text><text x="92" y="571" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-