rial,sans-serif" font-size="21" font-weight="400" fill="#4a5260" text-anchor="middle">Z3, CBMC,</text><text x="642" y="357" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260" text-anchor="middle">Batfish, IVy and</text><text x="642" y="384" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260" text-anchor="middle">TLA+ search it</text><line x1="642" y1="400" x2="642" y2="408" stroke="#c8940a" stroke-width="2" opacity="0.5"/><g filter="url(#lift)"><rect x="767" y="208" width="215" height="192" rx="16" fill="url(#glass)"/><rect x="767" y="208" width="215" height="192" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="781" y="209" width="187" height="1.4" rx="0.7" fill="url(#sheen)"/><circle cx="874" cy="248" r="19" fill="#c8940a"/><text x="874" y="257" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#ffffff" text-anchor="middle">4</text><text x="874" y="296" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f" text-anchor="middle">Report</text><text x="874" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260" text-anchor="middle">A proof, or a</text><text x="874" y="357" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260" text-anchor="middle">reproducible</text><text x="874" y="384" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260" text-anchor="middle">attack path</text><line x1="874" y1="400" x2="874" y2="408" stroke="#c8940a" stroke-width="2" opacity="0.5"/><g filter="url(#lift)"><rect x="68" y="408" width="914" height="46" rx="23" fill="url(#goldbar)"/></g><text x="525" y="439" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size