  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Apps Misuse the APIs They Run On</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="176" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="26" font-weight="600" fill="#14181f" font-style="italic">Cloud and app APIs are protocols, not calls — misuse still compiles.</text><g filter="url(#lift)"><rect x="68" y="206" width="500" height="270" rx="18" fill="url(#glass)"/><rect x="68" y="206" width="500" height="270" rx="18" fill="url(#gloss)" opacity="1"/><rect x="68" y="206" width="500" height="270" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="207" width="472" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="474" width="468" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="246" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">THE PATTERN</text><circle cx="99" cy="280" r="3.6" fill="#1d5fa8"/><text x="120" y="288" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">An object fetched by request ID with</text><text x="120" y="315" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">no ownership check — BOLA / IDOR</text><circle cx="99" cy="350" r="3.6" fill="#1d5fa8"/><text x="120" y="358" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">A credential written to a log;</text><text x="120" y="385" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">pagination left undrained</text><circle cx="99" cy="420" r="3.6" fill="#1d5fa8"/><text x="120" y="428" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Authorisation in middleware a scanner</text><text x="120" y="455" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">can't see</text><g filter="url(#lift)"><rect x="602" y="206" width="517" height="270" rx="18" fill="#fbe8f0" opacity="0.42"/><rect x="602" y="206" width="517" height="270" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="602" y="206" width="517" height="270" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="602" y="206" width="517" height="270" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="616" y="207" width="489" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="618" y="474" width="485" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="628" y="246" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#b81f63" letter-spacing="3.2">THE TREND IS NOT REVERSING</text><text x="628" y="302" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="32" font-weight="600" fill="#b81f63">+29%</text><text x="734" y="282" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">IDOR reports year on year (HackerOne</text><text x="734" y="307" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">2025)</text><text x="628" y="360" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="32" font-weight="600" fill="#b81f63">+36%</text><text x="734" y="340" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">access-control criticals — now #1</text><text x="734" y="365" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">(Bugcrowd 2025)</text><text x="628" y="418" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="32" font-weight="600" fill="#b81f63">~95%</text><text x="734" y="398" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">of API attacks carry a valid token —</text><text x="734" y="423" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">authentic, not authorised</text><g filter="url(#lift)"><rect x="68" y="478" width="337" height="138" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="68" y="478" width="337" height="138" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="478" width="337" height="138" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="478" width="337" height="138" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="479" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="614" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="92" y="536" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="44" font-weight="600" fill="#a87c00">$4.4M</text><text x="92" y="570" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">average cost of a data breach</text><text x="92" y="595" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">(IBM 2025)</text><g filter="url(#lift)"><rect x="425" y="478" width="337" height="138" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="425" y="478" width="337" height="138" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="425" y="478" width="337" height="138" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="425" y="478" width="337" height="138" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="439" y="479" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="441" y="614" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="449" y="536" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="44" font-weight="600" fill="#a87c00">241 days</text><text x="449" y="570" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">mean time to identify and</text><text x="449" y="595" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">contain (IBM 2025)</text><g filter="url(#lift)"><rect x="782" y="478" width="337" height="138" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="782" y="478" width="337" height="138" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="782" y="478" width="337" height="138" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="782" y="478" width="337" height="138" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="796" y="479" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="798" y="614" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="806" y="536" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="44" font-weight="600" fill="#a87c00">258 / day</text><text x="806" y="570" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">API attacks per enterprise —</text><text x="806" y="595" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">2× 2024 (Akamai 2025)</text><text x="68" y="668" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#a87c00">A correct policy invoked through a misused SDK still leaks.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">6</text></svg>