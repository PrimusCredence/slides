  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">The Base Went Post-Quantum. Are the Apps Ready?</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="176" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="26" font-weight="600" fill="#14181f" font-style="italic">The internet and cloud layer are shifting to hybrid PQC — and it is proven.</text><g filter="url(#lift)"><rect x="68" y="206" width="514" height="300" rx="18" fill="#e6f2ea" opacity="0.6"/><rect x="68" y="206" width="514" height="300" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="68" y="206" width="514" height="300" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="206" width="514" height="300" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="207" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="504" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="246" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#2f7d4f" letter-spacing="3.2">ALREADY SHIFTING, ALREADY PROVEN</text><circle cx="99" cy="288" r="3.6" fill="#2f7d4f"/><text x="120" y="296" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">NIST FIPS 203 / 204 / 205 (Aug 2024)</text><circle cx="99" cy="338" r="3.6" fill="#2f7d4f"/><text x="120" y="346" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Hybrid ML-KEM default in browsers</text><circle cx="99" cy="388" r="3.6" fill="#2f7d4f"/><text x="120" y="396" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Live at Cloudflare, AWS, Google, Apple</text><circle cx="99" cy="438" r="3.6" fill="#2f7d4f"/><text x="120" y="446" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">ML-KEM itself machine-checked (2024)</text><g filter="url(#lift)"><rect x="606" y="206" width="514" height="300" rx="18" fill="#fbe8f0" opacity="0.45"/><rect x="606" y="206" width="514" height="300" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="606" y="206" width="514" height="300" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="606" y="206" width="514" height="300" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="620" y="207" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="622" y="504" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="632" y="246" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#b81f63" letter-spacing="3.2">THE APP ON TOP IS NOT</text><circle cx="636.5" cy="288" r="3.6" fill="#b81f63"/><text x="658" y="296" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">No identity binding → impersonation</text><circle cx="636.5" cy="338" r="3.6" fill="#b81f63"/><text x="658" y="346" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Downgrade to legacy → decrypt later</text><circle cx="636.5" cy="388" r="3.6" fill="#b81f63"/><text x="658" y="396" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">KEM key reuse → forward secrecy lost</text><circle cx="636.5" cy="438" r="3.6" fill="#b81f63"/><text x="658" y="446" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Token not channel-bound → replayed</text><g filter="url(#lift)"><rect x="68" y="526" width="1051" height="118" rx="18" fill="#f6efdd" opacity="0.5"/><rect x="68" y="526" width="1051" height="118" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="68" y="526" width="1051" height="118" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="526" width="1051" height="118" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="527" width="1023" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="642" width="1019" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="70" y="540" width="5" height="90" rx="2.5" fill="#c8940a"/><text x="102" y="566" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" letter-spacing="2.4">LONG-SECRET VERTICALS BITE HARDEST</text><text x="102" y="600" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">Gov ID (10+ yr) · PKI · healthcare · defence (25–50 yr).</text><text x="102" y="628" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#4a5260">A mis-bound 10-year credential is a decade-long liability.</text><text x="68" y="680" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#a87c00">A proof at the transport layer says nothing about the app on top of it.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">6</text></svg>