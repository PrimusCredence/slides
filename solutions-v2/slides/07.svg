lateral movement is the phase that turns an incident into a breach.</text><g filter="url(#lift)"><rect x="68" y="216" width="337" height="158" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="68" y="216" width="337" height="158" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="216" width="337" height="158" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="216" width="337" height="158" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="217" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="372" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="92" y="280" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="48" font-weight="600" fill="#a87c00">29 min</text><text x="92" y="312" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">average breakout to the first</text><text x="92" y="337" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">lateral move (2025)</text><g filter="url(#lift)"><rect x="425" y="216" width="337" height="158" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="425" y="216" width="337" height="158" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="425" y="216" width="337" height="158" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="425" y="216" width="337" height="158" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="439" y="217" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="441" y="372" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="449" y="280" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="48" font-weight="600" fill="#a87c00">27 sec</text><text x="449" y="312" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">the fastest breakout ever</text><text x="449" y="337" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">observed</text><g filter="url(#lift)"><rect x="782" y="216" width="337" height="158" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="782" y="216" width="337" height="158" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="782" y="216" width="337" height="158" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="782" y="216" width="337" height="158" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="796" y="217" width="309" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="798" y="372" width="305" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="806" y="280" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="48" font-weight="600" fill="#a87c00">82%</text><text x="806" y="312" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">of intrusions were</text><text x="806" y="337" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">malware-free — valid access,</text><text x="806" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">not code</text><g filter="url(#lift)"><rect x="68" y="404" width="514" height="188" rx="16" fill="url(#glass)"/><rect x="68" y="404" width="514" height="188" rx="16" fill="url(#gloss)" opacity="1"/><rect x="68" y="404" width="514" height="188" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="405" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="590" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="444" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">WHY PROBING CAN'T ANSWER IT</text><circle cx="99" cy="476" r="3.6" fill="#1d5fa8"/><text x="120" y="484" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Tests only the paths you thought of</text><circle cx="99" cy="520" r="3.6" fill="#1d5fa8"/><text x="120" y="528" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Can't tell blocked from about-to-change</text><circle cx="99" cy="564" r="3.6" fill="#1d5fa8"/><text x="120" y="572" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">East-west is claimed more than shown</text><g filter="url(#lift)"><rect x="606" y="404" width="514" height="188" rx="16" fill="#f6efdd" opacity="0.45"/><rect x="606" y="404" width="514" height="188" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="606" y="404" width="514" height="188" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="606" y="404" width="514" height="188" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="620" y="405" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="622" y="590" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="632" y="444" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="17" font-weight="500" fill="#a87c00" letter-spacing="3.2">REACHABILITY IS A CONFIG PROPERTY</text><circle cx="636.5" cy="476" r="3.6" fill="#a87c00"/><text x="658" y="484" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Routes, SGs, NACLs, firewall rules</text><circle cx="636.5" cy="520" r="3.6" fill="#a87c00"/><text x="658" y="528" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Decided statically — no scanning window</text><circle cx="636.5" cy="564" r="3.6" fill="#a87c00"/><text x="658" y="572" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Precedent: AWS Tiros · Batfish</text><text x="68" y="654" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#a87c00">On an OT network probing is forbidden — the IT/OT boundary must be proven, not tested.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">7</text></svg>