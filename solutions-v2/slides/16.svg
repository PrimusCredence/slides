  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1a2e" flood-opacity="0.07"/>
</filter>
<filter id="liftsm" x="-30%" y="-40%" width="160%" height="200%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1a2e" flood-opacity="0.09"/>
</filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.99"/>
  <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.93"/>
  <stop offset="1" stop-color="#eef1f7" stop-opacity="0.92"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
  <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.14"/>
  <stop offset="0.47" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
</linearGradient>
<radialGradient id="orb" cx="0.32" cy="0.26" r="0.9">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
  <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
  <stop offset="1" stop-color="#000000" stop-opacity="0.13"/>
</radialGradient>
<linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Why the Provider's Clients Will Ask</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="184" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="28" font-weight="600" fill="#14181f" font-style="italic">Four things happened at once in the GCC — and their clients feel all four.</text><g filter="url(#lift)"><rect x="68" y="214" width="516" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="68" y="214" width="516" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="214" width="516" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="214" width="516" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="215" width="488" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="318" width="484" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="256" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#14181f">Mandatory replaced voluntary</text><text x="94" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">UAE cyber-resilience obligations now carry</text><text x="94" y="316" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">penalties of AED 100k–3m.</text><g filter="url(#lift)"><rect x="604" y="214" width="516" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="604" y="214" width="516" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="604" y="214" width="516" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="604" y="214" width="516" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="618" y="215" width="488" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="620" y="318" width="484" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="630" y="256" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#14181f">Assurance shifted to evidence</text><text x="630" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Regulators increasingly ask for demonstrable</text><text x="630" y="316" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">control effectiveness, not attestation.</text><g filter="url(#lift)"><rect x="68" y="336" width="516" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="68" y="336" width="516" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="336" width="516" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="336" width="516" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="337" width="488" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="440" width="484" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#14181f">Third-party risk is now in scope</text><text x="94" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Rules increasingly require evidence that</text><text x="94" y="438" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">integrations and components are controlled.</text><g filter="url(#lift)"><rect x="604" y="336" width="516" height="106" rx="16" fill="#f6efdd" opacity="0.42"/><rect x="604" y="336" width="516" height="106" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="604" y="336" width="516" height="106" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="604" y="336" width="516" height="106" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="618" y="337" width="488" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="620" y="440" width="484" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="630" y="378" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#14181f">Sovereignty is a reachability question</text><text x="630" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Localisation asks whether regulated data can</text><text x="630" y="438" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">leave — our reachability proofs settle it.</text><g filter="url(#lift)"><rect x="68" y="470" width="1051" height="172" rx="18" fill="url(#glass)"/><rect x="68" y="470" width="1051" height="172" rx="18" fill="url(#gloss)" opacity="1"/><rect x="68" y="470" width="1051" height="172" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="471" width="1023" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="640" width="1019" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="98" y="508" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.6">WHERE A FINDING ALSO LANDS</text><text x="98" y="550" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">DESC ISR</text><text x="384" y="550" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="428" y="550" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">NESA / UAE IAS</text><text x="715" y="550" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">2</text><text x="759" y="550" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">UAE PDPL</text><text x="1045" y="550" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">2 3</text><text x="98" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">SAMA CSF</text><text x="384" y="584" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="428" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">NCA ECC</text><text x="715" y="584" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="759" y="584" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">PCI DSS 4.0</text><text x="1045" y="584" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="98" y="618" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">ISO 27001</text><text x="384" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="428" y="618" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">CIS Controls</text><text x="715" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1 2 3</text><text x="759" y="618" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">NIST CSF 2.0</text><text x="1045" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" text-anchor="end">1–3</text><text x="68" y="680" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#767e8c" font-style="italic">Regulation routes the finding to a second reader. It is not the reason to commission it.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">16</text></svg>