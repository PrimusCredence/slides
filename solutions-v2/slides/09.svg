<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-goldink)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-goldink)" opacity="0.05"/><text x="68" y="112" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="46" font-weight="600" fill="#14181f">Proof — Now Feasible</text><rect x="68" y="128" width="112" height="4" rx="2" fill="#a87c00"/><text x="68" y="176" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="26" font-weight="600" fill="#14181f" font-style="italic">Formal verification used to take expert teams years. AI brings it into range.</text><g filter="url(#lift)"><rect x="68" y="206" width="514" height="206" rx="18" fill="#eef1f7" opacity="0.7"/><rect x="68" y="206" width="514" height="206" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="68" y="206" width="514" height="206" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="206" width="514" height="206" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="207" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="410" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="94" y="246" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#767e8c" letter-spacing="3.0">THEN</text><circle cx="99" cy="284" r="3.6" fill="#767e8c"/><text x="120" y="292" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Expert teams, bespoke specs, years</text><circle cx="99" cy="332" r="3.6" fill="#767e8c"/><text x="120" y="340" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Confined to avionics, silicon, protocols</text><circle cx="99" cy="380" r="3.6" fill="#767e8c"/><text x="120" y="388" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">“End users won’t write a spec”</text><g filter="url(#lift)"><rect x="606" y="206" width="514" height="206" rx="18" fill="#f6efdd" opacity="0.5"/><rect x="606" y="206" width="514" height="206" rx="18" fill="url(#glass)" opacity="0.45"/><rect x="606" y="206" width="514" height="206" rx="18" fill="url(#gloss)" opacity="0.9"/><rect x="606" y="206" width="514" height="206" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="620" y="207" width="486" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="622" y="410" width="482" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="632" y="246" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#a87c00" letter-spacing="3.0">NOW — AI-ASSISTED</text><circle cx="636.5" cy="284" r="3.6" fill="#a87c00"/><text x="658" y="292" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">AI assists modelling &amp; proof search</text><circle cx="636.5" cy="332" r="3.6" fill="#a87c00"/><text x="658" y="340" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Expert owns &amp; ratifies the spec</text><circle cx="636.5" cy="380" r="3.6" fill="#a87c00"/><text x="658" y="388" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">AWS runs ~1B SMT queries a day</text><g filter="url(#lift)"><rect x="68" y="430" width="1051" height="82" rx="16" fill="#14181f"/><rect x="69" y="431" width="1049" height="80" rx="15" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.16"/></g><text x="100" y="462" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#c8940a" letter-spacing="2.6">What we add</text><text x="278" y="462" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#ffffff">A preventive control with evidence behind it, beside your testing and SOC.</text><text x="278" y="492" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#c8940a">We add to your stack; we don’t replace it. Proof alone isn’t enough.</text><text x="68" y="562" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#4a5260" letter-spacing="2.4">WHAT STAYS WITH YOU — ALL OF IT NEEDED</text><text x="68" y="586" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Configuration drift, shadow</text><text x="68" y="612" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">assets and anything outside the</text><text x="68" y="638" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">model</text><text x="425" y="586" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Insider misuse, and valid</text><text x="425" y="612" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">credentials used exactly as</text><text x="425" y="638" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">intended</text><text x="782" y="586" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">Detection, response and the rest</text><text x="782" y="612" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">of the programme you already run</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">9</text></svg>