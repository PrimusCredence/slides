ca Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">logic and configuration in its database and admin panel</text><text x="98" y="412" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#1d5fa8">OWASP #1 Broken Access Control · #2 Misconfiguration — in 100% of apps</text><g filter="url(#lift)"><rect x="68" y="436" width="716" height="96" rx="14" fill="#f6efdd" opacity="0.4"/><rect x="68" y="436" width="716" height="96" rx="14" fill="url(#glass)" opacity="0.45"/><rect x="68" y="436" width="716" height="96" rx="14" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="436" width="716" height="96" rx="14" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="437" width="688" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="530" width="684" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="70" y="448" width="5" height="72" rx="2.5" fill="#c8940a"/><text x="94" y="466" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#a87c00" letter-spacing="2.2">THE APP ↔ CLOUD &amp; LIBRARY SEAM</text><circle cx="96" cy="502" r="4.5" fill="#1d5fa8"/><text x="112" y="508" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="500" fill="#4a5260">Access control via APIs</text><circle cx="340" cy="502" r="4.5" fill="#1d5fa8"/><text x="356" y="508" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="500" fill="#4a5260">SDK &amp; library usage</text><circle cx="548" cy="502" r="4.5" fill="#1d5fa8"/><text x="564" y="508" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="500" fill="#4a5260">Network paths &amp; zones</text><g filter="url(#lift)"><rect x="68" y="548" width="716" height="128" rx="16" fill="#e6f2ea" opacity="0.6"/><rect x="68" y="548" width="716" height="128" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" 