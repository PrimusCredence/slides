<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1187 742" width="1187" height="742" role="img"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;display=swap');</style><defs>
<filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0b1a2e" flood-opacity="0.11"/>
  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1a2e" flood-opacity="0.07"/>
</filter>
<filter id="liftsm" x="-30%" y="-40%" width="160%" height="200%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1a2e" flood-opacity="0.09"/>
</filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.99"/>
  <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.93"/>
  <stop offset="1" stop-color="#eef1f7" stop-opacity="0.92"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
  <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.14"/>
  <stop offset="0.47" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
</linearGradient>
<radialGradient id="orb" cx="0.32" cy="0.26" r="0.9">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
  <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
  <stop offset="1" stop-color="#000000" stop-opacity="0.13"/>
</radialGradient>
<linearGradient id="goldbar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c8940a"/>
  <stop offset="0.55" stop-color="#e0b64a"/>
  <stop offset="1" stop-color="#c8940a"/>
</linearGradient>
<radialGradient id="bl-gold"><stop offset="0" stop-color="#c8940a" stop-opacity="1"/><stop offset="0.45" stop-color="#c8940a" stop-opacity="0.45"/><stop offset="1" stop-color="#c8940a" stop-opacity="0"/></radialGradient><radialGradient id="bl-goldink"><stop offset="0" stop-color="#a87c00" stop-opacity="1"/><stop offset="0.45" stop-color="#a87c00" stop-opacity="0.45"/><stop offset="1" stop-color="#a87c00" stop-opacity="0"/></radialGradient><radialGradient id="bl-ink"><stop offset="0" stop-color="#14181f" stop-opacity="1"/><stop offset="0.45" stop-color="#14181f" stop-opacity="0.45"/><stop offset="1" stop-color="#14181f" stop-opacity="0"/></radialGradient><radialGradient id="bl-cyb"><stop offset="0" stop-color="#1d5fa8" stop-opacity="1"/><stop offset="0.45" stop-color="#1d5fa8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d5fa8" stop-opacity="0"/></radialGradient><radialGradient id="bl-ai"><stop offset="0" stop-color="#0f766e" stop-opacity="1"/><stop offset="0.45" stop-color="#0f766e" stop-opacity="0.45"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></radialGradient><radialGradient id="bl-cry"><stop offset="0" stop-color="#b81f63" stop-opacity="1"/><stop offset="0.45" stop-color="#b81f63" stop-opacity="0.45"/><stop offset="1" stop-color="#b81f63" stop-opacity="0"/></radialGradient></defs><rect width="1187" height="742" fill="#ffffff"/><circle cx="1017" cy="110" r="399" fill="url(#bl-cyb)" opacity="0.16"/><circle cx="130" cy="665" r="437" fill="url(#bl-gold)" opacity="0.13"/><circle cx="594" cy="380" r="494" fill="url(#bl-cyb)" opacity="0.05"/><text x="68" y="60" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="19" font-weight="500" fill="#1d5fa8" letter-spacing="2.6">SERVICE 1 — WHO MAY DO WHAT</text><text x="68" y="110" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="34" font-weight="600" fill="#14181f">1. Application Access-Policy &amp; Entitlement Verification</text><rect x="68" y="126" width="112" height="4" rx="2" fill="#1d5fa8"/><g filter="url(#lift)"><rect x="68" y="152" width="1051" height="86" rx="16" fill="#e9eff9" opacity="0.55"/><rect x="68" y="152" width="1051" height="86" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="152" width="1051" height="86" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="152" width="1051" height="86" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="153" width="1023" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="236" width="1019" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="70" y="164" width="5" height="62" rx="2.5" fill="#1d5fa8"/><text x="102" y="190" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f" font-style="italic">Can any app role, API token, plugin route or public user reach data</text><text x="102" y="224" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f" font-style="italic">it must not — through the app or its cloud role?</text><text x="68" y="290" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#1d5fa8" letter-spacing="3.2">THE PROBLEM</text><text x="68" y="328" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Authorisation lives in the app's admin</text><text x="68" y="359" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">panel, its plugins and its one cloud role.</text><text x="68" y="390" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">Each layer passes its own review. Nobody</text><text x="68" y="421" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#4a5260">checks them together.</text><line x1="68" y1="450" x2="560" y2="450" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="480" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#a87c00" font-style="italic">Checked at the moment an admin clicks Save —</text><text x="68" y="508" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#a87c00" font-style="italic">before anyone can use the change.</text><text x="68" y="552" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#767e8c" letter-spacing="2.2">ENGINE</text><text x="204" y="552" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#4a5260">Cedar + SymCC (CVC5), from the live app</text><text x="68" y="580" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#767e8c" letter-spacing="2.2">PRECEDENT</text><text x="204" y="580" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">AWS Cedar Analysis</text><text x="68" y="608" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#767e8c" letter-spacing="2.2">BUYERS</text><text x="204" y="608" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#4a5260">Platform &amp; AppSec teams · ISVs</text><g filter="url(#lift)"><rect x="588" y="256" width="531" height="352" rx="18" fill="url(#glass)"/><rect x="588" y="256" width="531" height="352" rx="18" fill="url(#gloss)" opacity="1"/><rect x="588" y="256" width="531" height="352" rx="18" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="602" y="257" width="503" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="604" y="606" width="499" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="614" y="292" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#1d5fa8" letter-spacing="2.6">IN THE DEMO</text><text x="1093" y="292" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#767e8c" text-anchor="end" font-style="italic">market tools clean first</text><rect x="614" y="308" width="109" height="27" rx="13.5" fill="#b06a00"/><text x="625" y="327" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#ffffff">VIOLATED</text><text x="735" y="328" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#14181f">Two admin changes, each fine</text><text x="614" y="355" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">Together, an Auditor at one hospital exports another</text><text x="614" y="379" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">hospital's restricted records. HTTP 200.</text><rect x="614" y="398" width="109" height="27" rx="13.5" fill="#b06a00"/><text x="625" y="417" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#ffffff">VIOLATED</text><text x="735" y="418" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#14181f">The GraphQL plugin side door</text><text x="614" y="445" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">No login, any document. REST still says 403.</text><rect x="614" y="464" width="109" height="27" rx="13.5" fill="#b06a00"/><text x="625" y="483" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#ffffff">VIOLATED</text><text x="735" y="484" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#14181f">The app ↔ cloud seam</text><text x="614" y="511" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#4a5260">One cloud role for all users: files cross tenants.</text><line x1="614" y1="540" x2="1093" y2="540" stroke="#e3e6ec" stroke-width="1"/><rect x="614" y="552" width="87" height="27" rx="13.5" fill="#2f7d4f"/><text x="625" y="571" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="18" font-weight="500" fill="#ffffff">PROVED</text><text x="713" y="572" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#2f7d4f">after each fix — every user, every request</text><g filter="url(#lift)"><rect x="68" y="626" width="1051" height="62" rx="16" fill="#e9eff9" opacity="0.55"/><rect x="68" y="626" width="1051" height="62" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="626" width="1051" height="62" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="626" width="1051" height="62" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="627" width="1023" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="686" width="1019" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><text x="100" y="663" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="20" font-weight="500" fill="#1d5fa8" letter-spacing="2.6">OUTPUT</text><text x="236" y="650" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">A proof that no role, token, plugin route or public user reaches what it must not —</text><text x="236" y="676" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#4a5260">or the exact request that breaks it.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">12</text></svg>